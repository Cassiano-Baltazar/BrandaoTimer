name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Evita baixar tudo do Maven a cada build (já deu erro 429).
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

      - name: Preparar chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sideload.jks"
          echo "SIDELOAD_KEYSTORE_PATH=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Gerar APK
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: brandao-timer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Cada push no main vira uma release com o APK, fácil de baixar no
      # celular pela página de releases.
      - name: Publicar release com o APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Brandão Timer v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: build/app/outputs/flutter-apk/app-release.apk

  # App de iPhone sem assinatura (IPA). Para instalar, assine com o seu
  # Apple ID usando o Sideloadly ou o AltStore; com Apple ID grátis o app
  # vale por 7 dias.
  ios:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Gerar IPA sem assinatura
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qr BrandaoTimer-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: brandao-timer-ipa
          path: build/ipa/BrandaoTimer-unsigned.ipa

      - name: Anexar IPA à release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          files: build/ipa/BrandaoTimer-unsigned.ipa
